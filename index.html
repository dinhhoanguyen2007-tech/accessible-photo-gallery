<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Image Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body onload="initializeGallery()">

    <header>
        <h1>My Accessible Photo Gallery</h1>
    </header>

    <main>
        <div id="image">
            Hover over or focus on an image below to display here.
        </div>

        <section class="gallery">
            <h2 class="sr-only">Image Preview List</h2>

            <img class="preview" 
                 alt="A beautiful ocean sunset with warm golden light" 
                 src="https://picsum.photos/id/10/600/400" 
                 onmouseover="upDate(this)" 
                 onmouseleave="unDo()" 
                 onfocus="upDate(this)" 
                 onblur="unDo()">

            <img class="preview" 
                 alt="Deep green forest with sunlight filtering through trees" 
                 src="https://picsum.photos/id/11/600/400" 
                 onmouseover="upDate(this)" 
                 onmouseleave="unDo()" 
                 onfocus="upDate(this)" 
                 onblur="unDo()">

            <img class="preview" 
                 alt="City skyline lit up bright at night" 
                 src="https://picsum.photos/id/12/600/400" 
                 onmouseover="upDate(this)" 
                 onmouseleave="unDo()" 
                 onfocus="upDate(this)" 
                 onblur="unDo()">

            <img class="preview" 
                 alt="Snow-covered mountain peak against a clear sky" 
                 src="https://picsum.photos/id/13/600/400" 
                 onmouseover="upDate(this)" 
                 onmouseleave="unDo()" 
                 onfocus="upDate(this)" 
                 onblur="unDo()">

            <img class="preview" 
                 alt="Tropical beach with turquoise water and white sand" 
                 src="https://picsum.photos/id/14/600/400" 
                 onmouseover="upDate(this)" 
                 onmouseleave="unDo()" 
                 onfocus="upDate(this)" 
                 onblur="unDo()">

            <img class="preview" 
                 alt="Vibrant spring valley full of blooming flowers" 
                 src="https://picsum.photos/id/15/600/400" 
                 onmouseover="upDate(this)" 
                 onmouseleave="unDo()" 
                 onfocus="upDate(this)" 
                 onblur="unDo()">
        </section>
    </main>

</body>
</html>
